; Impostazioni PHP per lo sviluppo locale (si aggiungono a php.ini-development)
date.timezone = Europe/Rome

; "E" iniziale: le variabili del container (.env.docker.local) finiscono in $_ENV anche sotto Apache.
; Senza, Symfony non le vede e usa quelle di .env.local (MySQL su 127.0.0.1 = il container stesso).
variables_order = "EGPCS"

memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 36M
max_execution_time = 120

; OPcache attivo ma rilegge i file modificati
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
realpath_cache_size = 4096K
